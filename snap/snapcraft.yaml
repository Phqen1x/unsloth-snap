name: unsloth-desktop
base: core24
version: '0.1.815-beta'
title: Unsloth Desktop
summary: Desktop client for Unsloth AI fine-tuning and inference
description: |
  Unsloth is a fast and memory-efficient platform for fine-tuning and running
  Large Language Models (LLMs) locally. Unsloth Studio provides an intuitive
  desktop interface to train, evaluate, quantize, and export models with
  support for NVIDIA (CUDA) and AMD (ROCm) GPUs.

  This snap is maintained unofficially. The maintainer has no affiliation
  with Unsloth.
website: https://unsloth.ai/
issues: https://github.com/phqen1x/unsloth-snap/issues
contact: https://github.com/phqen1x/unsloth-snap/issues
source-code: https://github.com/phqen1x/unsloth-snap
license: AGPL-3.0-only
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  browser-support:
    allow-sandbox: false
  shmem:
    interface: shared-memory
    private: true

parts:
  unsloth-desktop:
    plugin: dump
    source: unsloth-desktop.deb
    source-type: deb
    stage-packages:
      - zenity
      - curl
      - git
      - ca-certificates
      - libayatana-appindicator3-1
      - libappindicator3-1
    override-build: |
      craftctl default

      # Rename and customize desktop file
      mv "$CRAFT_PART_INSTALL/usr/share/applications/Unsloth.desktop" \
         "$CRAFT_PART_INSTALL/usr/share/applications/unsloth-desktop.desktop"
      sed -i 's|^Exec=.*|Exec=unsloth-desktop %u|' \
         "$CRAFT_PART_INSTALL/usr/share/applications/unsloth-desktop.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/unsloth-studio.png|' \
         "$CRAFT_PART_INSTALL/usr/share/applications/unsloth-desktop.desktop"
      sed -i 's|^Categories=.*|Categories=Development;Science;ArtificialIntelligence;|' \
         "$CRAFT_PART_INSTALL/usr/share/applications/unsloth-desktop.desktop"

      # Ensure install.sh is executable
      chmod +x "$CRAFT_PART_INSTALL/usr/lib/Unsloth/install.sh"

      # Ensure libappindicator3.so.1 exists for system tray support
      if [ ! -e "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libappindicator3.so.1" ] && [ -e "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libayatana-appindicator3.so.1" ]; then
        ln -sf libayatana-appindicator3.so.1 "$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libappindicator3.so.1"
      fi

  uv:
    plugin: nil
    override-build: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) arch="x86_64-unknown-linux-gnu" ;;
        arm64) arch="aarch64-unknown-linux-gnu" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      curl -fL -o uv.tar.gz "https://github.com/astral-sh/uv/releases/download/0.12.17/uv-${arch}.tar.gz"
      tar -xzf uv.tar.gz
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      cp "uv-${arch}/uv" "$CRAFT_PART_INSTALL/usr/bin/"
      cp "uv-${arch}/uvx" "$CRAFT_PART_INSTALL/usr/bin/"
      chmod +x "$CRAFT_PART_INSTALL/usr/bin/uv" "$CRAFT_PART_INSTALL/usr/bin/uvx"

  launcher:
    plugin: nil
    source: snap/local
    build-packages:
      - gcc
      - libc6-dev
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin" "$CRAFT_PART_INSTALL/usr/lib"
      cp launcher "$CRAFT_PART_INSTALL/bin/launcher"
      cp xdg-open "$CRAFT_PART_INSTALL/bin/xdg-open"
      chmod +x "$CRAFT_PART_INSTALL/bin/launcher" "$CRAFT_PART_INSTALL/bin/xdg-open"
      gcc -shared -fPIC -O2 -o "$CRAFT_PART_INSTALL/usr/lib/libsnap-affinity-wrapper.so" affinity-wrapper.c -ldl

apps:
  unsloth-desktop:
    command: usr/bin/unsloth-studio
    extensions: [gnome]
    command-chain:
      - bin/launcher
    desktop: usr/share/applications/unsloth-desktop.desktop
    environment:
      HOME: $SNAP_USER_COMMON
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
    plugs:
      - accel
      - audio-playback
      - browser-support
      - home
      - network
      - network-bind
      - network-status
      - opengl
      - hardware-observe
      - system-observe
      - process-control
      - removable-media
      - shmem
  unsloth:
    command: usr/bin/unsloth-studio
    extensions: [gnome]
    command-chain:
      - bin/launcher
    environment:
      HOME: $SNAP_USER_COMMON
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
    plugs:
      - accel
      - audio-playback
      - browser-support
      - home
      - network
      - network-bind
      - network-status
      - opengl
      - hardware-observe
      - system-observe
      - process-control
      - removable-media
      - shmem
  unsloth-studio:
    command: usr/bin/unsloth-studio
    extensions: [gnome]
    command-chain:
      - bin/launcher
    environment:
      HOME: $SNAP_USER_COMMON
      GIT_EXEC_PATH: $SNAP/usr/lib/git-core
      GIT_TEMPLATE_DIR: $SNAP/usr/share/git-core/templates
    plugs:
      - accel
      - audio-playback
      - browser-support
      - home
      - network
      - network-bind
      - network-status
      - opengl
      - hardware-observe
      - system-observe
      - process-control
      - removable-media
      - shmem
